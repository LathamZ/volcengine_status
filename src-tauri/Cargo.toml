[package]
name = "volcengine_status"
version = "1.0.5"
description = "macOS menu bar app for Volcengine Ark plan usage"
authors = ["LathamZhao"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "volcengine_status_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

# tray-icon 0.24.1 + upstream PR tauri-apps/tray-icon#365 (vendored, see
# vendor/tray-icon/PATCH.md). On macOS 27, AppKit claims the left click for the
# status item's NSMenu before tray-icon's interception subview sees it, so
# `TrayIconEvent::Click` never fires and the left-click popover stopped opening.
# The patch only attaches the menu while it is actually being presented.
# Drop this block once tauri depends on tray-icon >= 0.25 (i.e. tauri 3.x) -
# the version conflict fails the build loudly, it does not silently rot.
[patch.crates-io]
tray-icon = { path = "../vendor/tray-icon" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
